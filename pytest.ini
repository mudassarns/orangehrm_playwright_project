[pytest]

addopts = --html=reports/test-report.html --self-contained-html

log_cli = true
log_cli_level = INFO

log_level = INFO
log_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

markers =
    ui: UI tests
    api: API tests
    hybrid: UI and API integration tests
    db: Database tests
